name: Expo CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-and-merge-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Ensure it can prebuild for native (Android/iOS)
      - name: Prebuild native project (validate mobile build)
        run: npx expo prebuild --non-interactive

      - name: Set up Git user identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ⚡ Stash local changes before merge
      - name: Stash local changes
        run: git stash

      # Merge latest main into branch (simulation)
      - name: Merge latest main into branch (simulate)
        run: |
          git fetch origin main
          git merge origin/main --allow-unrelated-histories --no-edit

      # ⚡ Apply stashed changes if any
      - name: Apply stashed changes
        run: git stash pop || echo "No stashed changes"
